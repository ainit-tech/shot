<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>ainitShot</title>
<style>
:root {
  --bg: #1c1c1c;
  --stage: #121212;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #ededed;
  --muted: #a8a8a8;
  --faint: #767676;
  --accent: #2f6feb;
  --accent-hover: #4380f3;
  --accent-text: #8db3ff;
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; overflow: hidden; user-select: none; cursor: default; }
body.loading > * { visibility: hidden; }
button { font: inherit; color: inherit; cursor: default; }
:focus { outline: none; }
:focus-visible { outline: 2px solid #79a6ff; outline-offset: 2px; }

/* The slide: its moving picture, then its words. */
.deck { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 22px 30px 0; }
.stage {
  position: relative; flex: none; height: 278px; border-radius: 12px; overflow: hidden;
  background: var(--stage); box-shadow: inset 0 0 0 1px var(--line);
}
/* The picture is a drawing: it stays as drawn in a language written from right to left. */
#scene { display: block; width: 100%; height: 100%; direction: ltr; }
.words { flex: 1; min-height: 0; padding: 20px 4px 0; }
.step { color: var(--accent-text); font-size: 12.5px; font-weight: 600; letter-spacing: 0.04em; }
h1 { margin: 2px 0 10px; font: 600 27px/1.25 var(--display); }
#points { margin: 0; padding: 0; list-style: none; display: grid; gap: 7px; max-width: 760px; }
#points li { position: relative; padding-inline-start: 18px; color: #d6d6d6; }
#points li::before { content: ""; position: absolute; inset-inline-start: 2px; top: 0.62em; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
#points b { color: var(--text); font-weight: 600; }
.quiet { color: var(--muted); }
kbd {
  display: inline-grid; place-items: center; min-width: 24px; height: 23px; padding: 0 7px; margin: 0 1px;
  border: 1px solid rgba(255, 255, 255, 0.14); border-bottom-width: 2px; border-radius: 5px;
  background: #383838; color: var(--text); font: 600 12.5px/1 "Segoe UI Variable Text", "Segoe UI", sans-serif;
  vertical-align: 1px;
}
.plus { margin: 0 2px; color: var(--faint); font-size: 12px; }
.inline-btn { margin-left: 8px; height: 26px; padding: 0 12px; vertical-align: 1px; }
.entering .words, .entering .stage { animation: enter 0.32s ease-out; }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* The way through the slides. */
footer { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 30px 18px; }
.dots { display: flex; gap: 6px; }
.dots button { width: 8px; height: 8px; padding: 0; border: 0; border-radius: 4px; background: #4a4a4a; transition: width 0.2s, background 0.2s; }
.dots button:hover { background: #6a6a6a; }
.dots button[aria-current="step"] { width: 22px; background: var(--accent); }
.buttons { display: flex; gap: 8px; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 34px; padding: 0 16px; white-space: nowrap;
  border: 1px solid var(--line-strong); border-radius: 6px; background: #383838;
}
.btn:hover { background: #404040; }
.btn:active { background: #333; color: var(--muted); }
.btn.accent { border-color: transparent; background: var(--accent); color: #fff; }
.btn.accent:hover { background: var(--accent-hover); }
.btn.flat { border-color: transparent; background: none; color: var(--muted); }
.btn.flat:hover { background: rgba(255, 255, 255, 0.06); color: var(--text); }
.hidden { display: none !important; }

/* The picture. */
.ink { font-family: "Segoe UI Variable Text", "Segoe UI", sans-serif; }
</style>
</head>
<body class="loading">
<main class="deck" id="deck">
  <div class="stage"><svg id="scene" viewBox="0 0 640 250" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg></div>
  <div class="words">
    <div class="step" id="step"></div>
    <h1 id="title"></h1>
    <ul id="points"></ul>
  </div>
</main>
<footer>
  <div class="dots" id="dots" role="tablist"></div>
  <div class="buttons">
    <button class="btn flat" id="back"></button>
    <button class="btn hidden" id="open-settings"></button>
    <button class="btn accent" id="next"></button>
  </div>
</footer>
<script>
"use strict";

// The window talks to the program in JSON: it asks with `send`, and hears in `heard` below.
const webview = window.chrome && window.chrome.webview;
const send = message => webview && webview.postMessage(JSON.stringify(message));
const $ = (selector, root = document) => root.querySelector(selector);

const state = { language: "en", texts: {}, rightToLeft: false, settings: null, signedIn: null, tools: [], icons: {}, slide: 0 };

/** An element of the page with its attributes and children. */
function h(tag, attributes, ...children) {
  const element = document.createElement(tag);
  for (const [name, value] of Object.entries(attributes || {})) {
    if (value == null || value === false) continue;
    if (name.startsWith("on")) element.addEventListener(name.slice(2), value);
    else element.setAttribute(name, value === true ? "" : value);
  }
  element.append(...children.flat().filter(child => child != null && child !== false));
  return element;
}

/** Keys as caps: "Ctrl+Shift+C" or several of them. */
function keys(combination) {
  const parts = combination.split("+").map(part => part.trim());
  return h("span", {}, ...parts.flatMap((part, i) => [i ? h("span", { class: "plus" }, "+") : null, h("kbd", {}, part)]));
}

/** A line of a slide: text and keys, as `["text ", keys("Esc"), " text"]`. */
const line = (...parts) => h("li", {}, ...parts);

// The slides' texts in English; the program gives their translations into the language in force.
// `{name}` marks where keys go in a line, `**…**` what is bold.
const TEXT = {
  back: "Back",
  next: "Next",
  start: "Start",
  openSettings: "Open the settings",
  slides: "Slides",
  step: "{n} of {count}",
  s1: "One key for a screenshot",
  s1a: "{hotkey} freezes the screen.",
  s1b: "Draw a frame around what you need, or click a window to take it whole. {all} takes the whole monitor.",
  s1c: "The frame can be moved and pulled by its edges. A right click starts over, {esc} leaves.",
  s2: "Draw on top",
  s2a: "The tools are on the panel under the selection; each one's key is in its hint.",
  s2b: "The mouse wheel sets the width, the dot on the panel the colour. {shift} makes neat angles and squares.",
  s2c: "**Magic pencil** {magic}: circle roughly, and get a neat oval or rectangle.",
  s2d: "**Filled rectangle** {filled} hides what's extra: a password or a face won't go any further.",
  s3: "Everything can be put right",
  s3a: "What you've just drawn is picked: pull a circle to put right the tip of an arrow or a corner of a frame.",
  s3b: "With no tool chosen, any mark can be dragged. A **double click** on a label lets you edit its text.",
  s3c: "{delete} deletes a mark, {undo} undoes any change.",
  labelBefore: "Look here",
  labelAfter: "Look at this!",
  s4: "Take the result",
  s4a: "{copy} or {enter}: the picture with its marks in the clipboard.",
  s4b: "{copyText}: only the text in the picture. Windows reads it by itself, offline.",
  s4c: "{save}: save as a PNG file.",
  cardPicture: "Picture",
  cardText: "Text",
  cardFile: "PNG file",
  s5: "Ask Google",
  s5button: "{key} **{name}**: {doing}.",
  doingChat: "**press**, and Google's AI answers next to the selection, and you can ask further; **hold** to ask your own question aloud while holding",
  doingAnswer: "a short answer in a card next to the selection",
  doingImages: "where this picture comes from and where else it is",
  doingAi: "the AI's answer above the results in your browser",
  s5marks: "The screenshot goes with its marks: circle what you're asking about.",
  s5none: "There are no query buttons: add them in the settings, “Query buttons”.",
  press: "Press",
  hold: "Hold",
  aiMode: "Google's AI Mode",
  question: "Where was this taken?",
  speak: "speak while holding",
  letGo: "let go: the question is sent",
  s6: "Make it yours",
  s6a: "The settings are in the menu of the ainitShot icon in the tray: the hotkey, the colours, where the panels stand, your own query buttons with your own questions and keys, and the language.",
  s6out: "Sign in to Google once: the captcha comes less often, and conversations are kept.",
  s6in: "One signs in to Google once, in the program's window: fewer captchas, and conversations are kept.",
  signIn: "Sign in",
  general: "General",
  drawing: "Drawing",
  panels: "Panels",
  saving: "Saving",
  queryButtons: "Query buttons",
  googleAccount: "Google account",
  hotkey: "Hotkey",
  colors: "Colours",
  screenshots: "Pictures\\Screenshots",
  oneSignIn: "One sign-in, in the program's window",
  quoted: "“{text}”",
};

/** A text of the slides in the language in force, with `{name}` filled in from `values`. */
function say(key, values = {}) {
  const text = state.texts[key] || TEXT[key] || key;
  return text.replace(/\{(\w+)\}/g, (all, name) => (name in values && typeof values[name] !== "object" ? String(values[name]) : all));
}

/** A line of a slide from its text: `{name}` becomes the element given for it, `**…**` bold. */
function rich(key, nodes = {}) {
  const parts = say(key, nodes).split(/(\{\w+\}|\*\*[^*]+\*\*)/).filter(Boolean);
  return parts.map(part => {
    const node = /^\{(\w+)\}$/.exec(part);
    if (node && nodes[node[1]] != null) return nodes[node[1]];
    const bold = /^\*\*([^*]+)\*\*$/.exec(part);
    return bold ? h("b", {}, bold[1]) : part;
  });
}


// The picture: an SVG of the frozen screen, moved frame by frame.
const W = 640, H = 250;
const SVG = "http://www.w3.org/2000/svg";
function S(tag, attributes = {}, ...children) {
  const element = document.createElementNS(SVG, tag);
  for (const [name, value] of Object.entries(attributes)) if (value != null) element.setAttribute(name, value);
  element.append(...children.flat().filter(Boolean));
  return element;
}
function set(element, attributes) {
  for (const [name, value] of Object.entries(attributes)) element.setAttribute(name, value);
}
const clamp = (x, low, high) => Math.min(high, Math.max(low, x));
/** How far time `t` has gone from `a` to `b`, eased: 0 before, 1 after. */
const along = (t, a, b) => {
  const k = clamp((t - a) / (b - a), 0, 1);
  return k < 0.5 ? 4 * k * k * k : 1 - (-2 * k + 2) ** 3 / 2;
};
const mix = (a, b, k) => a + (b - a) * k;
const ACCENT = "#2f6feb";

/** An icon of the toolbar, as the program draws it, `size` pixels wide with its top left at x, y. */
function icon(parts, x, y, size, color) {
  const g = S("g", { transform: `translate(${x} ${y}) scale(${size / 20})` });
  for (const part of parts || []) {
    if (part.line) g.append(S("path", { d: part.line, fill: "none", stroke: color, "stroke-width": 1.6, "stroke-linecap": "round", "stroke-linejoin": "round" }));
    else if (part.fill) g.append(S("path", { d: part.fill, fill: color }));
    else if (part.dot) g.append(S("circle", { cx: part.dot[0], cy: part.dot[1], r: part.dot[2], fill: color }));
  }
  return g;
}

/** Lines of text on a page: grey bars of the given widths. */
function textLines(x, y, widths, step = 9, color = "#c9ccd1", height = 4) {
  return S("g", {}, widths.map((w, i) => S("rect", { x, y: y + i * step, width: w, height, rx: 2, fill: color })));
}

/** The desktop that is frozen: a wallpaper, a page with text, and a photo. */
function desktop() {
  const page = S("g", {},
    S("rect", { x: 40, y: 24, width: 300, height: 200, rx: 7, fill: "#f6f7f9" }),
    S("rect", { x: 40, y: 24, width: 300, height: 22, rx: 7, fill: "#e9ebef" }),
    S("rect", { x: 40, y: 38, width: 300, height: 8, fill: "#e9ebef" }),
    S("circle", { cx: 52, cy: 35, r: 3.2, fill: "#c4c8cf" }),
    S("rect", { x: 62, y: 32, width: 80, height: 6, rx: 3, fill: "#c4c8cf" }),
    S("rect", { x: 60, y: 60, width: 150, height: 9, rx: 3, fill: "#2b2f36" }),
    textLines(60, 80, [250, 238, 246, 180]),
    S("rect", { x: 60, y: 128, width: 56, height: 5, rx: 2.5, fill: "#8a9099" }),
    S("rect", { x: 60, y: 138, width: 170, height: 20, rx: 4, fill: "#fff", stroke: "#cfd3da" }),
    S("text", { x: 68, y: 152, fill: "#2b2f36", "font-size": 11, class: "ink", "letter-spacing": 1.5 }, "•••••••••"),
    textLines(60, 172, [240, 210, 120]),
  );
  const photo = S("g", {},
    S("rect", { x: 362, y: 40, width: 246, height: 182, rx: 7, fill: "#24272c" }),
    S("rect", { x: 374, y: 58, width: 222, height: 152, rx: 4, fill: "url(#sky)" }),
    S("circle", { cx: 548, cy: 92, r: 15, fill: "#ffd166" }),
    S("path", { d: "M 374 210 L 430 128 L 462 162 L 506 104 L 570 180 L 596 160 L 596 210 Z", fill: "#3d5a80" }),
    S("path", { d: "M 506 104 L 492 124 L 500 122 L 506 130 L 512 121 L 521 125 Z", fill: "#e8eef7" }),
    S("path", { d: "M 374 210 L 410 176 L 448 196 L 486 170 L 530 198 L 596 182 L 596 210 Z", fill: "#293d5a" }),
    S("rect", { x: 374, y: 46, width: 60, height: 5, rx: 2.5, fill: "#5b6270" }),
  );
  // The wallpaper reaches past the picture, so that a wider stage shows no edges.
  return S("g", {},
    S("rect", { x: -200, y: -50, width: W + 400, height: H + 100, fill: "url(#wall)" }),
    S("circle", { cx: 520, cy: 250, r: 190, fill: "url(#bloom)" }),
    page, photo);
}

function defs() {
  return S("defs", {},
    S("linearGradient", { id: "wall", x1: 0, y1: 0, x2: 1, y2: 1 },
      S("stop", { offset: 0, "stop-color": "#1b3557" }), S("stop", { offset: 1, "stop-color": "#2f5e94" })),
    S("radialGradient", { id: "bloom" },
      S("stop", { offset: 0, "stop-color": "#7fb2ff", "stop-opacity": 0.55 }), S("stop", { offset: 1, "stop-color": "#7fb2ff", "stop-opacity": 0 })),
    S("linearGradient", { id: "sky", x1: 0, y1: 0, x2: 0, y2: 1 },
      S("stop", { offset: 0, "stop-color": "#8ec5ff" }), S("stop", { offset: 1, "stop-color": "#f7d9b4" })),
    S("filter", { id: "shade", x: "-20%", y: "-20%", width: "140%", height: "160%" },
      S("feDropShadow", { dx: 0, dy: 2, stdDeviation: 2.5, "flood-color": "#000", "flood-opacity": 0.45 })),
    S("mask", { id: "hole", maskUnits: "userSpaceOnUse", x: -200, y: -50, width: W + 400, height: H + 100 },
      S("rect", { x: -200, y: -50, width: W + 400, height: H + 100, fill: "#fff" }),
      S("rect", { id: "hole-rect", x: 0, y: 0, width: 0, height: 0, fill: "#000" })),
  );
}

/** The frozen screen with what goes over it: the dimming with the selection or a window bright
 *  in it, the selection's frame and handles, the annotations, the panels, and the mouse. */
class Screen {
  constructor(svg) {
    svg.append(defs(), desktop());
    this.hole = $("#hole-rect", svg);
    this.dim = S("rect", { x: -200, y: -50, width: W + 400, height: H + 100, fill: "#000", "fill-opacity": 0.53, mask: "url(#hole)" });
    this.frame = S("rect", { fill: "none" });
    this.handles = S("g", {});
    this.marks = S("g", {});
    this.ui = S("g", {});
    this.top = S("g", {});
    this.mouse = S("g", {}, S("path", {
      d: "M 0 0 L 0 15.5 L 4.2 11.8 L 7 18 L 9.6 16.9 L 6.9 10.9 L 12.2 10.9 Z",
      fill: "#fff", stroke: "#111", "stroke-width": 1, "stroke-linejoin": "round",
    }));
    svg.append(this.dim, this.marks, this.frame, this.handles, this.ui, this.top, this.mouse);
    this.overlay(1);
    this.select(null);
  }

  /** How much the screen is dimmed, from 0 to 1. */
  overlay(k) {
    set(this.dim, { opacity: k });
  }

  /** The bright part: the selection with its frame and handles, a window lit up with a frame in
   *  the accent colour, or nothing. */
  select(r, kind = "selection") {
    if (!r) {
      set(this.hole, { width: 0, height: 0 });
      set(this.frame, { width: 0, height: 0, stroke: "none" });
      this.handles.replaceChildren();
      return;
    }
    set(this.hole, { x: r.x, y: r.y, width: r.w, height: r.h });
    if (kind === "window") {
      set(this.frame, { x: r.x + 1, y: r.y + 1, width: r.w - 2, height: r.h - 2, stroke: ACCENT, "stroke-width": 2, rx: 6 });
      this.handles.replaceChildren();
      return;
    }
    set(this.frame, { x: r.x - 0.5, y: r.y - 0.5, width: r.w + 1, height: r.h + 1, stroke: "#fff", "stroke-width": 1, rx: 0 });
    const xs = [r.x, r.x + r.w / 2, r.x + r.w], ys = [r.y, r.y + r.h / 2, r.y + r.h];
    const points = [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2], [1, 2], [0, 2], [0, 1]];
    this.handles.replaceChildren(...points.map(([i, j]) =>
      S("circle", { cx: xs[i], cy: ys[j], r: 2.6, fill: "#fff", stroke: "rgba(0,0,0,0.35)", "stroke-width": 0.8 })));
  }

  /** The mouse at a point, shown or hidden. */
  pointer(x, y, shown = true) {
    set(this.mouse, { transform: `translate(${x} ${y})`, opacity: shown ? 1 : 0 });
  }
}

/** The size of the selection next to it, as the program shows it. */
function sizePill() {
  const text = S("text", { x: 0, y: 0, fill: "#f2f2f2", "font-size": 9, class: "ink", "text-anchor": "middle" });
  const back = S("rect", { height: 15, rx: 7.5, fill: "rgba(28,28,28,0.92)" });
  const g = S("g", {}, back, text);
  g.show = (r, scale = 3) => {
    const label = `${Math.round(r.w * scale)} × ${Math.round(r.h * scale)}`;
    text.textContent = label;
    const width = 10 + label.length * 5.1;
    set(back, { x: r.x, y: r.y - 20, width });
    set(text, { x: r.x + width / 2, y: r.y - 9.5 });
  };
  return g;
}

/** The main panel as the program draws it, the tool `active` lit up; buttons 18 wide. */
function toolbar(x, y, active) {
  const order = ["Pencil", "Brush", "Line", "Arrow", "Rectangle", "FilledRectangle", "Text", "MagicPencil"];
  const groups = [order, ["color", "undo"], ["copy", "copyText", "save"], ["close"]];
  const g = S("g", { transform: `translate(${x} ${y})` });
  const width = 6 + 14 * 18 + 3 * 6;
  g.append(S("rect", { x: 0, y: 0, width, height: 24, rx: 7, fill: "rgba(32,32,32,0.97)", stroke: "rgba(255,255,255,0.1)", "stroke-width": 0.6, filter: "url(#shade)" }));
  const lit = {};
  let at = 3;
  groups.forEach((group, i) => {
    if (i) {
      g.append(S("rect", { x: at + 2.5, y: 7, width: 0.8, height: 10, fill: "rgba(255,255,255,0.14)" }));
      at += 6;
    }
    for (const name of group) {
      const back = S("rect", { x: at + 1.5, y: 4.5, width: 15, height: 15, rx: 4, fill: "transparent" });
      g.append(back);
      lit[name] = back;
      if (name === "color") {
        g.append(S("circle", { cx: at + 9, cy: 12, r: 4, fill: "#e53935", stroke: "rgba(255,255,255,0.8)", "stroke-width": 1 }));
      } else {
        g.append(icon(state.icons[name], at + 3.5, 6.5, 11, "#ececec"));
      }
      at += 18;
    }
  });
  g.width = width;
  g.light = name => {
    for (const [key, back] of Object.entries(lit)) set(back, { fill: key === name ? ACCENT : "transparent" });
  };
  g.light(active);
  return g;
}

/** The panel of the query buttons, as a column: the first buttons of the settings. */
function queryColumn(x, y) {
  const buttons = (state.settings.buttons || []).slice(0, 4);
  const ai = buttons.filter(b => b.mode !== "images"), images = buttons.filter(b => b.mode === "images");
  const groups = [ai, images].filter(group => group.length);
  const count = buttons.length;
  const height = 6 + count * 18 + (groups.length - 1) * 6;
  const g = S("g", { transform: `translate(${x} ${y - height})` });
  g.append(S("rect", { x: 0, y: 0, width: 24, height, rx: 7, fill: "rgba(32,32,32,0.97)", stroke: "rgba(255,255,255,0.1)", "stroke-width": 0.6, filter: "url(#shade)" }));
  let at = 3;
  groups.forEach((group, i) => {
    if (i) {
      g.append(S("rect", { x: 7, y: at + 2.5, width: 10, height: 0.8, fill: "rgba(255,255,255,0.14)" }));
      at += 6;
    }
    for (const button of group) {
      const look = button.icon || (button.mode === "images" ? "images" : "google");
      if (look === "google" || look === "translate") {
        g.append(S("text", { x: 12, y: at + 12.5, fill: "#ececec", "font-size": look === "google" ? 10 : 7.5, "font-weight": 700, class: "ink", "text-anchor": "middle" }, look === "google" ? "G" : "A\u042f"));
      } else {
        g.append(icon(state.icons[look], 6.5, at + 3.5, 11, "#ececec"));
      }
      at += 18;
    }
  });
  g.height = height;
  return g;
}

/** A stroke drawn bit by bit: its path, shown up to `k` of its length. */
function drawn(path, k) {
  const length = path.getTotalLength ? path.getTotalLength() : 0;
  set(path, { "stroke-dasharray": `${length} ${length}`, "stroke-dashoffset": length * (1 - k) });
}

/** An arrow annotation from one point to another, as the program draws it. */
function arrowShape(color = "#e53935", width = 3) {
  const shaft = S("path", { fill: "none", stroke: color, "stroke-width": width, "stroke-linecap": "round" });
  const head = S("path", { fill: color, stroke: color, "stroke-width": width * 0.4, "stroke-linejoin": "round" });
  const g = S("g", {}, shaft, head);
  g.to = (x1, y1, x2, y2) => {
    const length = Math.hypot(x2 - x1, y2 - y1);
    if (length < 1) {
      set(shaft, { d: "" });
      set(head, { d: "" });
      return;
    }
    const [ux, uy] = [(x2 - x1) / length, (y2 - y1) / length];
    const size = Math.min(Math.max(width * 3.5, 12), length);
    const half = size * 0.55;
    const [bx, by] = [x2 - ux * size, y2 - uy * size];
    set(shaft, { d: `M ${x1} ${y1} L ${x2 - ux * size * 0.6} ${y2 - uy * size * 0.6}` });
    set(head, { d: `M ${x2} ${y2} L ${bx - uy * half} ${by + ux * half} L ${bx + uy * half} ${by - ux * half} Z` });
  };
  return g;
}

/** The handles of the annotation picked: white with a ring in the accent colour. */
function pickHandle() {
  return S("circle", { r: 3.6, fill: "#fff", stroke: ACCENT, "stroke-width": 1.4 });
}

/** A label as the program draws it: letters in their colour over a soft shadow. */
function labelShape(x, y, color = "#e53935") {
  const shadow = S("text", { x, y: y + 1.5, fill: "#000", opacity: 0.45, "font-size": 15, "font-weight": 600, class: "ink", filter: "url(#shade)" });
  const text = S("text", { x, y, fill: color, "font-size": 15, "font-weight": 600, class: "ink" });
  const g = S("g", {}, shadow, text);
  g.write = value => {
    shadow.textContent = value;
    text.textContent = value;
  };
  g.end = () => x + (text.getComputedTextLength ? text.getComputedTextLength() : 0);
  return g;
}

/** Two quick rings at a point: a double click. */
function clickRings() {
  const a = S("circle", { r: 0, fill: "none", stroke: "#fff", "stroke-width": 1.4 });
  const b = S("circle", { r: 0, fill: "none", stroke: "#fff", "stroke-width": 1.4 });
  const g = S("g", {}, a, b);
  g.at = (x, y, t) => {
    for (const [ring, start] of [[a, 0], [b, 160]]) {
      const k = clamp((t - start) / 360, 0, 1);
      set(ring, { cx: x, cy: y, r: 3 + k * 10, opacity: k > 0 && k < 1 ? 1 - k : 0 });
    }
  };
  return g;
}

/** A key cap drawn in the picture, `width` wide and `size` high, pressed down by `down` from 0
 *  to 1, and lit around while it is `held`. */
function keyCap(x, y, text, size = 34, width = size) {
  const base = S("rect", { x, y: y + 3, width, height: size, rx: 7, fill: "#1f1f1f" });
  const top = S("rect", { width, height: size - 2, rx: 7, fill: "#3b3b3b", stroke: "rgba(255,255,255,0.16)", "stroke-width": 0.8 });
  const label = S("text", { fill: "#f0f0f0", "font-size": size * 0.42, "font-weight": 700, class: "ink", "text-anchor": "middle" }, text);
  const glow = S("rect", { x: x - 4, y: y - 4, width: width + 8, height: size + 9, rx: 10, fill: "none", stroke: ACCENT, "stroke-width": 2, opacity: 0 });
  const g = S("g", {}, glow, base, top, label);
  g.press = (down, held = 0) => {
    const dy = down * 3;
    set(top, { x, y: y + dy });
    set(label, { x: x + width / 2, y: y + dy + size * 0.64 });
    set(glow, { opacity: held });
  };
  g.press(0);
  return g;
}

/** A small window of the program next to the selection, with an answer being written. */
function answerWindow(x, y, w, h) {
  const g = S("g", {});
  g.append(S("rect", { x, y, width: w, height: h, rx: 7, fill: "#202124", stroke: "rgba(255,255,255,0.12)", "stroke-width": 0.6, filter: "url(#shade)" }));
  g.append(S("text", { x: x + 10, y: y + 15, fill: "#8db3ff", "font-size": 8.5, "font-weight": 600, class: "ink" }, say("aiMode")));
  const bars = [0.92, 0.84, 0.88, 0.6].map((part, i) =>
    S("rect", { x: x + 10, y: y + 26 + i * 10, height: 4.5, rx: 2.2, fill: "#5f6368", "data-full": (w - 20) * part, width: 0 }));
  g.append(...bars);
  g.write = k => bars.forEach((bar, i) => set(bar, { width: Math.max(0, Math.min(1, k * bars.length - i)) * bar.dataset.full }));
  return g;
}

          ...(state.settings.colors || []).slice(0, 8).map((color, i) => S("circle", { cx: area.x + 12 + i * 28, cy: area.y + 44, r: 10, fill: color, stroke: "rgba(255,255,255,0.2)" }))),
        S("g", {}, S("text", { x: area.x, y: area.y + 14, fill: "#ededed", "font-size": 12, "font-weight": 600, class: "ink" }, say("panels")),
          S("rect", { x: area.x + 40, y: area.y + 34, width: 120, height: 70, fill: "#343434", stroke: "rgba(255,255,255,0.7)", "stroke-width": 0.8 }),
          S("rect", { x: area.x + 80, y: area.y + 110, width: 80, height: 10, rx: 3, fill: "#2c2c2c", stroke: "rgba(255,255,255,0.2)", "stroke-width": 0.6 }),
          S("rect", { x: area.x + 166, y: area.y + 70, width: 10, height: 34, rx: 3, fill: "#2c2c2c", stroke: "#8db3ff", "stroke-width": 0.8 })),
        S("g", {}, S("text", { x: area.x, y: area.y + 14, fill: "#ededed", "font-size": 12, "font-weight": 600, class: "ink" }, say("saving")),
          S("rect", { x: area.x, y: area.y + 30, width: 230, height: 26, rx: 6, fill: "#1d1d1d", stroke: "rgba(255,255,255,0.12)" }),
          S("text", { x: area.x + 10, y: area.y + 47, fill: "#a8a8a8", "font-size": 10, class: "ink" }, say("screenshots"))),
        S("g", {}, S("text", { x: area.x, y: area.y + 14, fill: "#ededed", "font-size": 12, "font-weight": 600, class: "ink" }, say("queryButtons")),
          ...(state.settings.buttons || []).slice(0, 3).map((button, i) => S("g", {},
            S("rect", { x: area.x, y: area.y + 28 + i * 34, width: 230, height: 28, rx: 6, fill: "#2b2b2b" }),
            S("text", { x: area.x + 12, y: area.y + 46 + i * 34, fill: "#ededed", "font-size": 10, class: "ink" }, button.name),
            button.key ? S("text", { x: area.x + 218, y: area.y + 46 + i * 34, fill: "#8db3ff", "font-size": 10, "font-weight": 700, class: "ink", "text-anchor": "end" }, button.key) : null))),
        S("g", {}, S("text", { x: area.x, y: area.y + 14, fill: "#ededed", "font-size": 12, "font-weight": 600, class: "ink" }, say("googleAccount")),
          S("rect", { x: area.x, y: area.y + 30, width: 230, height: 40, rx: 8, fill: "rgba(47,111,235,0.16)", stroke: "rgba(47,111,235,0.45)" }),
          S("text", { x: area.x + 12, y: area.y + 54, fill: "#ededed", "font-size": 10.5, class: "ink" }, say("oneSignIn"))),
      ];
      svg.append(...pages);
      return {
        loop: sections.length * 1400,
        at(t) {
          const now = Math.floor(t / 1400) % sections.length;
          const k = along(t % 1400, 0, 260);
          rows.forEach((row, i) => {
            set(row.back, { fill: i === now ? "rgba(255,255,255,0.08)" : "transparent" });
            set(row.mark, { opacity: i === now ? 1 : 0 });
          });
          pages.forEach((page, i) => set(page, { opacity: i === now ? k : 0 }));
        },
      };
    },
  },
];


// Going through the slides.
let playing = 0;

function show(index) {
  const count = SLIDES.length;
  state.slide = clamp(index, 0, count - 1);
  const slide = SLIDES[state.slide];
  $("#step").textContent = say("step", { n: state.slide + 1, count });
  $("#title").textContent = say(slide.title);
  $("#points").replaceChildren(...slide.points());
  for (const [i, dot] of [...$("#dots").children].entries()) {
    if (i === state.slide) dot.setAttribute("aria-current", "step");
    else dot.removeAttribute("aria-current");
  }
  const last = state.slide === count - 1;
  $("#back").classList.toggle("hidden", state.slide === 0);
  $("#open-settings").classList.toggle("hidden", !last);
  $("#next").textContent = last ? say("start") : say("next");
  $("#back").textContent = say("back");
  $("#open-settings").textContent = say("openSettings");
  const deck = $("#deck");
  deck.classList.remove("entering");
  void deck.offsetWidth;
  deck.classList.add("entering");
  play(slide);
}

/** Draws the slide's picture anew and moves it on a loop until another slide is shown. */
function play(slide) {
  cancelAnimationFrame(playing);
  const svg = $("#scene");
  svg.replaceChildren();
  const picture = slide.picture(svg);
  const start = performance.now();
  const frame = now => {
    picture.at((now - start) % picture.loop);
    playing = requestAnimationFrame(frame);
  };
  picture.at(0);
  playing = requestAnimationFrame(frame);
}

function next() {
  if (state.slide === SLIDES.length - 1) send({ type: "close" });
  else show(state.slide + 1);
}

$("#next").addEventListener("click", next);
$("#back").addEventListener("click", () => show(state.slide - 1));
$("#open-settings").addEventListener("click", () => send({ type: "settings" }));
document.addEventListener("keydown", event => {
  if (event.target.closest && event.target.closest("button") && (event.key === "Enter" || event.key === " ")) return;
  switch (event.key) {
    case "ArrowRight": case "PageDown": case "Enter": case " ":
      event.preventDefault();
      return next();
    case "ArrowLeft": case "PageUp": case "Backspace":
      event.preventDefault();
      return show(state.slide - 1);
    case "Home": return show(0);
    case "End": return show(SLIDES.length - 1);
    case "Escape": return send({ type: "close" });
  }
});
document.addEventListener("contextmenu", event => event.preventDefault());


// What the program tells the page.
/** The dots of the slides, named in the language in force. */
function renderDots() {
  document.documentElement.lang = state.language;
  document.documentElement.dir = state.rightToLeft ? "rtl" : "ltr";
  $("#dots").setAttribute("aria-label", say("slides"));
  $("#dots").replaceChildren(...SLIDES.map((slide, i) =>
    h("button", { role: "tab", title: say(slide.title), "aria-label": say(slide.title), onclick: () => show(i) })));
}

/** The language in force, from the program: its code, the slides' texts in it, its direction. */
function speak(message) {
  state.language = message.language || "en";
  state.texts = message.texts || {};
  state.rightToLeft = !!message.rightToLeft;
  if (message.tools) state.tools = message.tools;
  renderDots();
}

function init(message) {
  speak(message);
  state.settings = message.settings || {};
  state.signedIn = message.signedIn;
  state.tools = message.tools || [];
  state.icons = message.icons || {};
  document.body.classList.remove("loading");
  show(0);
}

function heard(message) {
  switch (message.type) {
    case "init": return init(message);
    case "settings":
      state.settings = message.settings || state.settings;
      if (message.language) speak(message);
      return show(state.slide);
    case "account":
      state.signedIn = message.signedIn;
      if (state.slide === SLIDES.length - 1) $("#points").replaceChildren(...SLIDES[state.slide].points());
      return;
  }
}

if (webview) webview.addEventListener("message", event => heard(event.data));
send({ type: "ready" });
</script>
</body>
