<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>ainitShot</title>
<style>
:root {
  --bg: #1c1c1c;
  --line-strong: rgba(255, 255, 255, 0.14);
  --text: #ededed;
  --muted: #a8a8a8;
  --accent: #2f6feb;
  --accent-hover: #4380f3;
  font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  color: var(--text);
  background: var(--bg);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: flex; flex-direction: column; overflow: hidden; user-select: none; cursor: default; }
body.loading > * { visibility: hidden; }
button { font: inherit; color: inherit; cursor: default; }
:focus { outline: none; }
:focus-visible { outline: 2px solid #79a6ff; outline-offset: 2px; }

/* The clip: its picture with its sentence, and the list of its chapters beside them. */
#clip { flex: none; padding: 10px 10px 0; }

/* The way out: the offer to sign in while nobody is, the settings, and the start. */
footer { flex: 1; display: flex; align-items: flex-end; gap: 16px; padding: 12px 24px 18px; }
.offer { display: flex; align-items: center; gap: 12px; min-width: 0; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
.buttons { display: flex; gap: 8px; margin-inline-start: auto; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: none;
  height: 34px; padding: 0 16px; white-space: nowrap;
  border: 1px solid var(--line-strong); border-radius: 6px; background: #383838;
}
.btn:hover { background: #404040; }
.btn:active { background: #333; color: var(--muted); }
.btn.accent { border-color: transparent; background: var(--accent); color: #fff; }
.btn.accent:hover { background: var(--accent-hover); }
.hidden { display: none !important; }
</style>
</head>
<body class="loading">
<div id="clip"></div>
<footer>
  <div class="offer hidden" id="offer">
    <span id="offer-text"></span>
    <button class="btn" id="sign-in"></button>
  </div>
  <div class="buttons">
    <button class="btn" id="open-settings"></button>
    <button class="btn accent" id="start"></button>
  </div>
</footer>
<script>
/* The clip. */
</script>
<script>
"use strict";

// The window talks to the program in JSON: it asks with `send`, and hears in `heard` below.
const webview = window.chrome && window.chrome.webview;
const send = message => webview && webview.postMessage(JSON.stringify(message));
const $ = selector => document.querySelector(selector);

// The window's own words in English; the program gives their translations into the language in
// force. The clip has its own words, and four of the program's, which its chapters on asking show
// (clip/program-terms.json): the window doesn't, but they keep their English here, and every
// catalog is checked for them as for the window's.
const TEXT = {
  start: "Start",
  openSettings: "Open the settings",
  signInOffer: "Sign in to Google once: the captcha comes less often, and conversations are kept.",
  signIn: "Sign in",
  aiMode: "Google's AI Mode",
  question: "Where was this taken?",
  speak: "speak while holding",
  letGo: "let go: the question is sent",
};

const state = {
  language: "en", rightToLeft: false, texts: {}, clip: {}, terms: {},
  settings: null, signedIn: null, icons: {}, chapter: 0,
};
let player = null;

/** The clip's chapters: those of the site's overview, and saving after copying the text, which the
 * site shows among the features. */
const CHAPTERS = AinitShotClip.chapters.includes("save")
  ? AinitShotClip.chapters
  : AinitShotClip.chapters.flatMap(id => (id === "copy-text" ? [id, "save"] : [id]));

const say = key => state.texts[key] || TEXT[key];

/** The clip's words from the flat keys of the catalog: "picture.explorer.places.0" is the first
 * of the places. */
function unflatten(flat) {
  const words = {};
  for (const [key, text] of Object.entries(flat)) {
    const path = key.split(".");
    let node = words;
    path.forEach((part, i) => {
      if (i === path.length - 1) node[part] = text;
      else node = node[part] ??= /^\d+$/.test(path[i + 1]) ? [] : {};
    });
  }
  return words;
}

/** What the clip shows: the language in force, the hotkey and the query buttons of the settings
 * in force, and the program's icons. */
function options() {
  return {
    language: state.language,
    direction: state.rightToLeft ? "rtl" : "ltr",
    theme: "dark",
    hotkey: state.settings.hotkey,
    buttons: state.settings.buttons || [],
    actions: "column",
    words: { ...unflatten(state.clip), program: AinitShotClip.programWords(state.terms) },
    icons: state.icons,
  };
}

/** The window's own words, and the offer to sign in while nobody is. */
function render() {
  document.documentElement.lang = state.language;
  document.documentElement.dir = state.rightToLeft ? "rtl" : "ltr";
  $("#offer-text").textContent = say("signInOffer");
  $("#sign-in").textContent = say("signIn");
  $("#offer").classList.toggle("hidden", state.signedIn !== false);
  $("#open-settings").textContent = say("openSettings");
  $("#start").textContent = say("start");
}

/** The language in force, from the program: its code, its direction, the window's words in it,
 * the clip's own and the program's that the clip shows. */
function speak(message) {
  state.language = message.language || "en";
  state.rightToLeft = !!message.rightToLeft;
  state.texts = message.texts || {};
  state.clip = message.clip || {};
  state.terms = message.terms || {};
}

function init(message) {
  speak(message);
  state.settings = message.settings || {};
  state.signedIn = message.signedIn;
  state.icons = message.icons || {};
  render();
  document.body.classList.remove("loading");
  player = AinitShotClip.mount($("#clip"), {
    ...options(),
    chapters: CHAPTERS,
    autoplay: true,
    caption: true,
    keyboard: true,
    onChapter: i => { state.chapter = i; },
  });
}

function heard(message) {
  switch (message.type) {
    case "init": return init(message);
    case "settings":
      state.settings = message.settings || state.settings;
      if (message.language) speak(message);
      render();
      return player && player.update(options());
    case "account":
      state.signedIn = message.signedIn;
      return render();
  }
}

$("#start").addEventListener("click", () => send({ type: "close" }));
$("#open-settings").addEventListener("click", () => send({ type: "settings" }));
$("#sign-in").addEventListener("click", () => send({ type: "account" }));
document.addEventListener("keydown", event => {
  if (event.key === "Escape") send({ type: "close" });
});
document.addEventListener("contextmenu", event => event.preventDefault());

if (webview) webview.addEventListener("message", event => heard(event.data));
send({ type: "ready" });
</script>
</body>
</html>
