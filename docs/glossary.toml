text = "Google: वह सेवा, जिसे क्वेरी स्क्रीनशॉट भेजती है। इसमें AI मोड है, जो क्वेरी का मुख्य लक्ष्य है, और तस्वीर से खोज भी।"
forms = ["सर्च इंजन", "सर्च इंजनों"]

[[terms]]
id = "ai-mode"
section = "actions"
code = ["AiMode"]
status = "accepted"

[terms.en]
name = "AI mode"
kind = "part of a search engine"
text = "The part of a search engine where its AI answers a question about a picture in words. Google answers on top of its results for the picture and the question (AI Overview), and AI Mode is the next tab there. It takes one picture together with the question."
notes = ["Queries that ask about the picture go here; the image search has buttons of its own."]
forms = ["AI mode", "AI modes"]

[terms.ru]
name = "Режим ИИ"
kind = "часть поисковика"
text = "Часть поисковика, где его ИИ отвечает на вопрос о картинке словами. Google отвечает сверху над своими результатами по картинке и вопросу («Обзор от ИИ»), а AI Mode — соседняя вкладка там же. Принимает одну картинку вместе с вопросом."
notes = ["Сюда уходят запросы, которые спрашивают о картинке; у поиска по картинке свои кнопки."]
forms = [
  "режим ИИ",
  "режима ИИ",
  "режиму ИИ",
  "режимом ИИ",
  "режиме ИИ",
  "режимы ИИ",
  "режимов ИИ",
  "режимам ИИ",
  "режимами ИИ",
  "режимах ИИ",
]

[terms.hi]
name = "AI मोड"
kind = "सर्च इंजन का भाग"
text = "सर्च इंजन का वह भाग, जहाँ उसका AI तस्वीर के बारे में सवाल का जवाब शब्दों में देता है। Google तस्वीर और सवाल के अपने नतीजों के ऊपर जवाब देता है (AI Overview), और AI Mode वहीं पास वाला टैब है। यह सवाल के साथ एक तस्वीर लेता है।"
notes = ["तस्वीर के बारे में पूछने वाली क्वेरी यहाँ जाती हैं; तस्वीर से खोज के अपने बटन हैं।"]
forms = ["AI मोड", "AI मोडों"]

[[terms]]
id = "image-search"
section = "actions"
code = ["ImageSearch"]
status = "accepted"

[terms.en]
name = "Image search"
kind = "part of a search engine"
text = "The part of a search engine that finds where a picture comes from and where else it is: Google Lens, which is also behind Google Images. It takes the picture alone, without a question; queries to it have buttons of their own."
forms = ["image search", "image searches"]

[terms.ru]
name = "Поиск по картинке"
kind = "часть поисковика"
text = "Часть поисковика, которая находит, откуда картинка и где ещё она встречается: Google Lens, на котором работают и Google Картинки. Принимает картинку без вопроса; у запросов в неё свои кнопки."
forms = [
  "поиск по картинке",
  "поиска по картинке",
  "поиску по картинке",
  "поиском по картинке",
  "поиске по картинке",
]

[terms.hi]
name = "तस्वीर से खोज"
kind = "सर्च इंजन का भाग"
text = "सर्च इंजन का वह भाग, जो पता करता है कि तस्वीर कहाँ से है और कहाँ-कहाँ मिलती है: Google Lens, जिस पर Google Images भी चलता है। यह बिना सवाल के केवल तस्वीर लेता है; इसकी क्वेरी के अपने बटन हैं।"
forms = ["तस्वीर से खोज"]

[[terms]]
