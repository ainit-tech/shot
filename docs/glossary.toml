  "мини-промптами",
  "мини-промптах",
]

[terms.hi]
name = "मिनी-प्रॉम्प्ट"
kind = "सेटिंग"
text = "वह सवाल, जो स्क्रीनशॉट के साथ सर्च इंजन के AI मोड को जाता है: क्या खोजना, समझाना या अनुवाद करना है।"
forms = ["मिनी-प्रॉम्प्ट", "मिनी-प्रॉम्प्टों"]
