# The term base of the documentation.
#
# The glossary page (docs/<lang>/glossary.md) takes its term cards and its term base table
# from here: the page only holds the markers `<!-- glossary: term base -->` and
# `<!-- glossary: terms -->` where they go. The same data gives the hints over terms
# in the texts of every page.
#
# Every term is written in every language of the site:
# - `name`, `kind`, `text` (the definition) and `notes` (bullet points) make its card;
# - `forms` are the word forms that mark the term in page texts, letter case aside;
# - `avoid` lists phrases in which a form means something else, such as "taskbar";
# - `status` inside a language overrides the term's status for that language.

[labels.en]
code = "Code"
kind = "Kind"
status = "Status"
and = "and"

[labels.ru]
code = "В коде"
kind = "Вид"
status = "Статус"
and = "и"

[labels.hi]
code = "कोड"
kind = "श्रेणी"
status = "स्टेटस"
and = "और"

[statuses]
accepted = { en = "accepted", ru = "принят", hi = "स्वीकृत" }
proposed = { en = "proposed", ru = "предложен", hi = "प्रस्तावित" }
open = { en = "open", ru = "под вопросом", hi = "विचाराधीन" }

[[sections]]
id = "capture"
title = { en = "1. Capture", ru = "1. Захват экрана", hi = "1. स्क्रीन कैप्चर" }

[[sections]]
id = "drawing"
title = { en = "2. Drawing", ru = "2. Рисование", hi = "2. ड्रॉइंग" }

[[sections]]
id = "actions"
title = { en = "3. Actions", ru = "3. Действия", hi = "3. क्रियाएँ" }

# 1. Capture

[[terms]]
