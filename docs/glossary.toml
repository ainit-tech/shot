section = "capture"
code = ["Selection"]
status = "accepted"

[terms.en]
name = "Selection"
kind = "entity"
text = "The part of the screen picked with the mouse after the hotkey. Annotations are drawn inside it, and actions take it together with them."
notes = ["Don't confuse with: the screenshot, which is the selection together with its annotations."]
