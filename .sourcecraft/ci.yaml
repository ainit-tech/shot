# Releases of ainitShot (decision 13). A tag vX.Y.Z builds the program for Windows on a Linux worker
# with its installer and latest.json (ci/build.sh), then signs them and copies them to
# https://shot.ainit.tech/download/ (ci/publish.sh). The tag must match the version in Cargo.toml.
on:
  push:
    - workflows: [release]
      filter:
        tags: ["v*"]

workflows:
  release:
    tasks:
      - name: release
        cubes:
          - name: build
            # cargo-xwin for x86_64-pc-windows-msvc, pinned, so that a release builds as the one
            # before it did; ci/build.sh puts in the version of Rust it builds with.
            image: docker.io/messense/cargo-xwin@sha256:9856b895265d4966f212228ba64802cf89337e2a2a537aa2533c1b8784cbc81b
            script:
              - apt-get update -qq && apt-get install -y -qq nsis
              - bash ci/build.sh "$SOURCECRAFT_COMMIT_REF_NAME"
            artifacts:
              paths:
                - dist
          - name: publish
            image: docker.io/library/debian:bookworm-slim
            env:
              MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
              PUBLISH_SSH_KEY: ${{ secrets.PUBLISH_SSH_KEY }}
            script:
              - apt-get update -qq && apt-get install -y -qq minisign openssh-client
              - bash ci/publish.sh "$SOURCECRAFT_COMMIT_REF_NAME"
